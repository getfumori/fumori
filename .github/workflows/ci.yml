name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install the locked pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck Node.js, Web, and test targets
        run: pnpm run typecheck

      - name: Install current stable Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run source acceptance tests
        run: pnpm run test:unit

      - name: Build, pack, install, and smoke the npm artifact
        run: pnpm run test:package
